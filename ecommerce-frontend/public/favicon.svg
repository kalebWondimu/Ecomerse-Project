<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="#ffffff"/>
  
  <!-- Main Shopping Bag Shape -->
  <path d="M 80 70 L 90 50 L 166 50 L 176 70 Z" fill="url(#grad1)" stroke="url(#grad1)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Bag Body -->
  <path d="M 90 70 L 85 180 Q 85 200 105 200 L 151 200 Q 171 200 171 180 L 176 70 Z" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Left Handle -->
  <path d="M 100 70 Q 100 20 128 20 Q 128 20 128 20" fill="none" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Right Handle -->
  <path d="M 176 70 Q 176 20 128 20 Q 128 20 128 20" fill="none" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Shine/Highlight -->
  <ellipse cx="110" cy="120" rx="15" ry="40" fill="#ffffff" opacity="0.25"/>
  
  <!-- Accent dots -->
  <circle cx="128" cy="95" r="3.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="135" cy="145" r="2.5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Check mark inside bag (for verified/trusted) -->
  <path d="M 115 135 L 125 145 L 140 125" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
